packages:
  - "apps/*"
  - "packages/*"

# Single source of truth for dependency versions across every workspace package.
# Referenced as `"typescript": "catalog:"` in package.json files.
catalog:
  # Language + tooling
  # TypeScript is pinned to 5.9 on purpose: typescript-eslint@8 declares a
  # `typescript >=4.8.4 <6.1.0` peer range, so TS 7 would silently disable
  # type-aware linting. Revisit when typescript-eslint ships TS 7 support.
  typescript: 5.9.3
  "@types/node": 26.4.1
  tsx: 4.23.13
  rimraf: 6.1.3

  # Lint + format
  eslint: 10.9.1
  typescript-eslint: 8.69.0
  eslint-config-prettier: 10.1.8
  globals: 17.12.0
  prettier: 3.9.6
  prettier-plugin-tailwindcss: 0.8.1

  # Validation + shared runtime
  zod: 4.5.4
  date-fns: 4.4.0

  # Data
  mongoose: 9.9.4
  # Must track the driver version mongoose depends on (~7.5), since the Db
  # handle returned by the connection is passed straight to the auth adapter.
  mongodb: 7.5.0

  # Auth
  better-auth: 1.7.2

  # Testing
  vitest: 4.1.11
  "@vitest/coverage-v8": 4.1.11

# Dependencies permitted to run install scripts (pnpm >= 11). Everything else
# is blocked, so a transitive package cannot execute code during `pnpm install`.
# These are native toolchain packages that legitimately need a postinstall step.
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true
